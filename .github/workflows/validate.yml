name: Validate plugin

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Check JavaScript syntax
        working-directory: website-design-ultra
        run: |
          for script in scripts/*.mjs; do
            node --check "$script"
          done

      - name: Check reference-intake automation syntax
        run: |
          node --check automation/reference-intake/validate-reference-intake.mjs
          node --check automation/reference-intake/export-figma-rest.mjs

      - name: Test offline reference intake
        run: node --test tests/immersive/reference-intake/reference-intake.test.mjs

      - name: Test immersive telemetry calculations and status handling
        run: node --test tests/immersive/telemetry/telemetry-schema.test.mjs tests/immersive/telemetry/performance-summary.test.mjs tests/immersive/telemetry/ip-03c-status.test.mjs

      # Offline half of the implementation evaluation, including the guard that
      # the shard matrix still lists every fixture the runner knows about. It
      # needs no browser, so it runs here once instead of in every shard.
      - name: Test offline implementation evaluation
        run: node --test tests/immersive/evaluation/evaluation.test.mjs

      - name: Test plugin template sync
        run: node --test tests/templates/sync.test.mjs

      - name: Run the shipped comparator from the plugin tree
        run: node --experimental-strip-types website-design-ultra/templates/runtime/compare-baselines.mjs --help

      - name: Validate plugin content
        working-directory: website-design-ultra
        run: node scripts/validate-content.mjs

      - name: Validate with Claude Code
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.220 plugin validate . --strict
          npx --yes @anthropic-ai/claude-code@2.1.220 plugin validate website-design-ultra --strict

      - name: Replay offline forward fixtures
        working-directory: website-design-ultra
        run: node scripts/run-forward-tests.mjs --dry-run

      # A plugin whose central claim is a deterministic copy linter has to pass
      # its own linter. NO-COPY is exit code 2, not a pass.
      - name: Lint the plugin's own copy
        working-directory: website-design-ultra
        run: node scripts/lint-copy.mjs --self

  # Root-only executable surfaces (ADR-011). These are fast, need no browser and
  # no GPU, and were previously verified only by hand.
  root-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      # The runner's own python3 is used rather than pinning another action.
      # numpy is the only third-party import in the root python suites.
      - name: Install python dependencies
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Queue driver contract
        run: |
          python3 -m unittest automation/immersive-production-v2/test_chain_driver.py
          python3 automation/immersive-production-v2/chain_driver.py --check

      - name: Volume research benchmark
        run: python3 -m unittest volume_research/tests/test_volume_research.py

      # Byte-level reproducibility of the committed volume artefacts. This is
      # encoder determinism; the rendered-capture proof lives in the
      # deterministic-capture job and neither substitutes for the other.
      - name: Volume artefact reproducibility
        run: bash volume_research/scripts/reproduce.sh

      # Source-contract regressions for the procedural fixture. No Blender
      # needed: these read committed source, they do not generate geometry.
      - name: Procedural source contracts
        run: |
          python3 procedural-generation/test_ip10c_review_regressions.py
          node procedural-generation/test_ip10c_debug_regressions.mjs

      # The source generator owns a small root-only package so its imports are
      # resolved from a committed lockfile rather than from a fixture's install.
      - name: Install procedural generator dependencies
        run: npm ci --ignore-scripts --prefix procedural-generation

      # J-C4's dependency-pinned generator is a real CI execution, not a
      # source-only contract check. It writes scratch artifacts so CI never
      # mutates the fixture.
      - name: Run JavaScript procedural generator
        run: |
          rm -rf "${RUNNER_TEMP}/wdu-crystal-js"
          node procedural-generation/js/crystal-growth.mjs \
            --shape crystal --seed 1337 --iterations 6 --facets 96 \
            --output-dir "${RUNNER_TEMP}/wdu-crystal-js"
          test -s "${RUNNER_TEMP}/wdu-crystal-js/crystal-growth.glb"
          test -s "${RUNNER_TEMP}/wdu-crystal-js/report.json"

      - name: Test JavaScript procedural generator
        run: node --test procedural-generation/js/*.test.mjs

      # The generator itself needs a real Blender install, which this runner
      # does not have. It is deliberately not run here rather than being run
      # and allowed to report a green result it cannot support.
      - name: Declare Blender capability
        run: echo "UNAVAILABLE capability=blender — generator suites run on a host with Blender; see procedural-generation/README.md"

  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lab/package-lock.json

      - name: Install lab (exact lockfile)
        working-directory: lab
        run: npm ci

      - name: Lab suite
        working-directory: lab
        run: npm test

  starter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: starters/next-r3f-cinematic/package-lock.json

      - name: Install starter (exact lockfile)
        working-directory: starters/next-r3f-cinematic
        run: npm ci

      # The definition of done requires that a fresh run builds the starter
      # without reconstructing the architecture. This is that check.
      - name: Typecheck, test, build
        working-directory: starters/next-r3f-cinematic
        run: npm run verify

  deterministic-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Test deterministic capture contract
        env:
          NODE_NO_WARNINGS: 1
        run: node --test tests/immersive/deterministic-capture/capture-comparator.test.mjs

      - name: Install pinned Chromium
        run: |
          npx --yes --package playwright@1.62.1 playwright install --with-deps chromium
          npx --yes --package @playwright/cli@0.1.17 playwright-cli install-browser --with-deps chromium

      - name: Compare two clean deterministic captures
        env:
          NODE_NO_WARNINGS: 1
        run: node tests/immersive/deterministic-capture/compare-captures.mjs --out "${{ runner.temp }}/wdu-deterministic-capture"

      - name: Capture IP-02C performance summary
        env:
          NODE_NO_WARNINGS: 1
        run: node tests/immersive/telemetry/capture-ip-02c.mjs --out "${{ runner.temp }}/wdu-ip-03b-capture"

      - name: Archive deterministic capture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deterministic-capture
          path: |
            ${{ runner.temp }}/wdu-deterministic-capture
            ${{ runner.temp }}/wdu-ip-03b-capture
          if-no-files-found: error
          retention-days: 14

  # One shard per fixture. The suite is the same suite; only the scheduling
  # changed. Running all fourteen fixtures serially took 45m53s on main at
  # a9b432c and was cancelled by this job's own timeout, so the live gate had
  # no result at all. Sharded, the wall clock is the slowest single fixture.
  #
  # The matrix list is asserted against the runner's own fixture enumeration by
  # tests/immersive/evaluation/evaluation.test.mjs, so a fixture cannot be added
  # to the repository and silently never run here.
  #
  # fail-fast is off on purpose: one fixture failing must not hide the verdict
  # of the other thirteen, and the deliberate failing fixtures each prove a
  # different gate.
  immersive-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - product-hero
          - procedural-crystal
          - build-fail
          - failed-resource
          - fallback-fail
          - interaction-fail
          - keyboard-fail
          - mobile-fail
          - reduced-motion-fail
          - runtime-console-error
          - shader-error
          - telemetry-first-frame-fail
          - telemetry-transfer-fail
          - telemetry-warm-gpu-fail
    env:
      WDU_PLAYWRIGHT_CLI_VERSION: 0.1.17
      WDU_CHROMIUM_REVISION: '1234'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      # Cache npm's shared download cache (the fixture install is a clean
      # exact-lockfile `npm ci`) plus the Playwright CLI package and browser
      # binaries, so a warm run reuses them instead of re-downloading. The
      # browser key embeds the versions pinned in this job's env block: a
      # version bump misses the key and installs fresh binaries.
      - name: Cache npm downloads and Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: >-
            ${{ runner.os }}-immersive-evaluation-cli-${{
            env.WDU_PLAYWRIGHT_CLI_VERSION }}-chromium-${{
            env.WDU_CHROMIUM_REVISION }}
          restore-keys: |
            ${{ runner.os }}-immersive-evaluation-cli-${{ env.WDU_PLAYWRIGHT_CLI_VERSION }}-
            ${{ runner.os }}-immersive-evaluation-cli-

      # Install the CLI once outside the repository. The verifier then uses
      # this executable for every browser action instead of starting npx for
      # each command, which keeps the all-fixture evaluation within the job
      # timeout while preserving the pinned version.
      - name: Install pinned Playwright CLI package
        run: |
          npm install --prefix "${{ runner.temp }}/wdu-playwright-cli" --no-save --no-package-lock --ignore-scripts @playwright/cli@${{ env.WDU_PLAYWRIGHT_CLI_VERSION }}
          echo "WDU_PLAYWRIGHT_CLI=${{ runner.temp }}/wdu-playwright-cli/node_modules/.bin/playwright-cli" >> "$GITHUB_ENV"

      # ADR-010 status semantics up front: an unavailable browser capability
      # fails this step with the probe's own reason instead of letting the
      # suite silently skip its live cases.
      - name: Probe browser CLI capability
        working-directory: website-design-ultra
        run: node scripts/verify-browser.mjs --probe

      - name: Install pinned Chromium for the Playwright CLI
        run: |
          npx --yes --package playwright@1.62.1 playwright install --with-deps chromium
          "$WDU_PLAYWRIGHT_CLI" install-browser --with-deps chromium

      # Live evidence run for this shard's fixture. Output states duration per
      # phase and external cost; exit 2 means an applicable gate was
      # UNAVAILABLE. The offline unit tests run once in the validate job
      # rather than being repeated in every shard.
      - name: Run live immersive implementation evaluation
        id: evaluation
        run: |
          set +e
          node tests/immersive/evaluation/run-implementation-evaluation.mjs \
            --fixture "${{ matrix.fixture }}" \
            --out "${{ runner.temp }}/wdu-immersive-evaluation"
          code=$?
          set -e
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
          echo "IMPLEMENTATION_EVALUATION exited with code=$code (0=PASS 1=mismatch 2=UNAVAILABLE)"
          exit "$code"

      # Exit 2 above lands here on purpose: the failure is re-stated as the
      # explicit release-readiness result instead of being swallowed. Browser
      # or GPU unavailability marks the suite unverified — it never becomes a
      # pass, and a red or unverified evaluation blocks release readiness.
      - name: Report GPU/browser capability result
        if: failure()
        run: |
          echo "::error::Immersive evaluation not verified: exit-code=${{ steps.evaluation.outputs.exit-code }}."
          if [ "${{ steps.evaluation.outputs.exit-code }}" = "2" ]; then
            echo "::error::Browser or GPU capability UNAVAILABLE — the immersive evaluation suite is unverified. This blocks release readiness (ADR-010: unavailable execution is never PASS)."
          else
            echo "::error::An evaluation gate failed unexpectedly — inspect the archived artifacts."
          fi
          exit 1

      - name: Summarize duration and external cost
        if: always()
        run: |
          summary="${{ runner.temp }}/wdu-immersive-evaluation/evaluation.json"
          if [ ! -f "$summary" ]; then
            echo "No suite summary was produced; see earlier steps for the failure."
            exit 1
          fi
          jq -r '"status=\(.status) fixtures=\(.fixtures | length) durationMs=\(.durationMs) externalServices=\(.externalServices)"' "$summary"
          jq -r '.fixtures[] | "  \(.fixture): status=\(.status) expectationMet=\(.expectationMet) durationMs=\(.durationMs) gates=\(.gates | to_entries | map("\(.key)=\(.value)") | join(" "))"' "$summary"

      - name: Archive immersive evaluation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: immersive-evaluation-${{ matrix.fixture }}
          path: ${{ runner.temp }}/wdu-immersive-evaluation
          if-no-files-found: error
          retention-days: 30

  # One status check that stands for the whole sharded suite, so branch
  # protection has a single name to require and a cancelled or skipped shard
  # cannot pass as an absent check. ADR-010 holds: anything that is not a
  # success here leaves the suite unverified, never passed.
  immersive-evaluation-gate:
    runs-on: ubuntu-latest
    needs: immersive-evaluation
    if: always()
    steps:
      - name: Require every fixture shard to have succeeded
        run: |
          result="${{ needs.immersive-evaluation.result }}"
          echo "immersive evaluation shards: $result"
          if [ "$result" = "success" ]; then
            exit 0
          fi
          echo "::error::Immersive evaluation not verified: shard aggregate result=$result. Browser or GPU unavailability, a cancelled shard and a failed gate all land here, and none of them is a pass (ADR-010). Inspect the per-fixture immersive-evaluation-<fixture> artifacts."
          exit 1

  release-provenance:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Verify release tag and changelog provenance
        working-directory: website-design-ultra
        run: node scripts/release.mjs --strict
