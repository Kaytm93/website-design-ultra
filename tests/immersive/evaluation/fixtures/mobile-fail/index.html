<!doctype html>
<html lang="en" data-wdu-mode="deterministic" data-wdu-ready="true">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>mobile-fail — deliberate failing fixture</title>
    <script src="/common/telemetry-surface.js"></script>
    <style>
      .scene-frame {
        position: relative;
        width: 800px;
        max-width: 100%;
        aspect-ratio: 16 / 9;
        background: #f0ece2;
        border-radius: 12px;
      }
      .scene-frame canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Deliberate failing fixture: the scene vanishes under the mobile viewport</h1>
      <p>
        The scene canvas is removed from the DOM as soon as the viewport
        narrows to a mobile width, so the mobile capture cannot contain the
        hero and the mobile gate must fail.
      </p>
      <div class="scene-frame">
        <canvas id="scene" width="800" height="450"></canvas>
      </div>
    </main>
    <script>
      // The mobile defect: remove the scene canvas when the viewport enters
      // the mobile width. The verifier resizes the session after load, so
      // the removal is reactive to the media query, not a load-time guess.
      const query = window.matchMedia('(max-width: 640px)')
      const canvas = document.getElementById('scene')
      const apply = () => {
        if (query.matches && canvas.isConnected) canvas.remove()
      }
      query.addEventListener('change', apply)
      apply()
    </script>
  </body>
</html>
