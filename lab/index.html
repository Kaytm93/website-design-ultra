<!doctype html>
<html lang="en" data-wdu-mode="live">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wdu-lab</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0c;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      #lab-error {
        display: none;
        position: fixed;
        inset: 12px 12px auto 12px;
        z-index: 100;
        max-height: 46vh;
        overflow: auto;
        background: rgba(28, 8, 8, 0.92);
        color: #ffb4b4;
        border: 1px solid #7a1a1a;
        border-radius: 8px;
        padding: 12px 14px;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 12px;
        line-height: 1.55;
        white-space: pre-wrap;
      }
      #lab-error.visible {
        display: block;
      }
      #lab-controls {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 50;
        min-width: 220px;
        max-width: 320px;
      }
    </style>
  </head>
  <body>
    <div id="lab-error" role="alert" aria-live="assertive"></div>
    <div id="root"></div>
    <div id="lab-controls"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
